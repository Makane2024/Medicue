version: 1
applications:
  - appRoot: Frontend
    frontend:
      phases:
        preBuild:
          commands:
            # Vite 8 needs Node 20.19+ or 22.12+; the Amplify image's default can be older
            - nvm install 22
            - nvm use 22
            - npm install -g pnpm@10.34.3
            - pnpm install --frozen-lockfile
        build:
          commands:
            # VITE_API_URL and VITE_PAYMENT_SIMULATION come from the app's environment variables in the Amplify console
            - pnpm run build
      artifacts:
        baseDirectory: dist
        files:
          - '**/*'
      cache:
        paths:
          - node_modules/**/*
